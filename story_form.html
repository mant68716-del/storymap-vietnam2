{% extends 'base.html' %}{% block title %}Lưu Story · {{province['name']}}{% endblock %}{% block content %}<div class="form-page"><a class="back" href="{{url_for('home')}}">← Quay lại bản đồ</a><div class="form-card"><div class="province-title"><span class="pin">📍</span><div><div class="eyebrow">LƯU KỶ NIỆM</div><h1>{{province['name']}}</h1><p>Story này sẽ tự đánh dấu <b>{{province['name']}}</b> là tỉnh đã đi.</p></div></div><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{csrf_token()}}"><div class="grid2"><label>Tiêu đề *<input name="title" required placeholder="Một ngày tuyệt vời ở {{province['name']}}"></label><label>Ngày đi<input type="date" name="visit_date"></label></div><label>Địa điểm cụ thể<input name="location" placeholder="Ví dụ: Hồ Xuân Hương, Đà Lạt"></label><label>Nội dung Story *<textarea name="content" required rows="7" placeholder="Bạn đã thấy gì? Cảm xúc thế nào? Điều gì đáng nhớ?"></textarea></label><div class="grid2"><label>Vĩ độ <input name="latitude" type="number" step="any" placeholder="21.03"></label><label>Kinh độ <input name="longitude" type="number" step="any" placeholder="105.85"></label></div><label class="upload-box">📷 🎬 Ảnh / Video<input id="media" type="file" name="media" multiple accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/quicktime,video/webm,video/x-m4v"><small>Chọn nhiều ảnh/video. Video hỗ trợ MP4, MOV, WebM, M4V. Bản local cho phép tối đa 512 MB mỗi request.</small></label><div id="preview" class="media-preview"></div><button class="btn primary big" type="submit">💾 Lưu Story vào {{province['name']}}</button></form></div></div>{% endblock %}{% block scripts %}<script>const input=document.getElementById('media'), preview=document.getElementById('preview'); input.addEventListener('change',()=>{preview.innerHTML=''; [...input.files].forEach(f=>{const box=document.createElement('div');box.className='preview-item'; if(f.type.startsWith('video/')){const v=document.createElement('video');v.controls=true;v.src=URL.createObjectURL(f);box.appendChild(v)}else{const img=document.createElement('img');img.src=URL.createObjectURL(f);box.appendChild(img)}const s=document.createElement('small');s.textContent=f.name;box.appendChild(s);preview.appendChild(box)})});</script>{% endblock %}
