{% extends 'base.html' %}{% block title %}Hồ sơ · StoryMap{% endblock %}{% block content %}<div class="profile-page"><div class="profile-hero"><div class="avatar">{{user['name'][0]|upper}}</div><div><div class="eyebrow">HỒ SƠ CỦA BẠN</div><h1>{{user['name']}}</h1><p>{{user['email']}}</p></div></div><div class="stats"><div><b>{{visited_count}}/63</b><span>Tỉnh đã đi</span></div><div><b>{{story_count}}</b><span>Story</span></div><div><b>{{task_count}}</b><span>Task đang làm</span></div></div><div class="form-card"><h2>Chỉnh sửa hồ sơ</h2><form method="post"><input type="hidden" name="csrf" value="{{csrf_token()}}"><label>Họ tên<input name="name" value="{{user['name']}}" required></label><label>Giới thiệu<textarea name="bio" rows="4" placeholder="Một chút về hành trình của bạn...">{{user['bio']}}</textarea></label><button class="btn primary">Lưu thay đổi</button></form></div></div>{% endblock %}
